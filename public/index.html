<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣即時氣象 GIS 觀測儀表板 | Taiwan Weather GIS</title>
  <meta name="description" content="基於中央氣象署 CWA 開放資料之即時台灣氣象 GIS 互動地圖儀表板，支援全台 22 縣市溫度、降雨機率與氣象分析。">
  
  <!-- Google Fonts: Outfit & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Top Navigation Bar -->
    <header class="app-header" id="appHeader">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-cloud-bolt"></i>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">台灣氣象 GIS 儀表板</h1>
          <span class="brand-subtitle">Taiwan Weather GIS Dashboard</span>
        </div>
      </div>

      <!-- Quick Metrics Bar -->
      <div class="header-metrics" id="headerMetrics">
        <div class="metric-pill">
          <span class="metric-label"><i class="fa-solid fa-temperature-half"></i> 全台均溫</span>
          <span class="metric-value" id="statAvgTemp">-- °C</span>
        </div>
        <div class="metric-pill hot-pill">
          <span class="metric-label"><i class="fa-solid fa-temperature-arrow-up"></i> 最高溫</span>
          <span class="metric-value" id="statMaxTemp">--</span>
        </div>
        <div class="metric-pill cool-pill">
          <span class="metric-label"><i class="fa-solid fa-temperature-arrow-down"></i> 最低溫</span>
          <span class="metric-value" id="statMinTemp">--</span>
        </div>
        <div class="metric-pill rain-pill">
          <span class="metric-label"><i class="fa-solid fa-cloud-showers-heavy"></i> 降雨警戒</span>
          <span class="metric-value" id="statRainAlert">--</span>
        </div>
      </div>

      <!-- Right Controls -->
      <div class="header-actions">
        <div class="status-indicator" title="資料更新狀態">
          <span class="pulse-dot"></span>
          <span class="status-text" id="lastUpdatedTime">更新中...</span>
          <span class="source-badge" id="dataSourceBadge">連線檢測中</span>
        </div>
        <button class="btn-icon" id="btnRefresh" title="重新載入氣象資料" aria-label="重新整理">
          <i class="fa-solid fa-rotate"></i>
        </button>
        <button class="btn-sidebar-toggle" id="btnToggleSidebar" aria-label="切換側邊欄">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="main-container">
      <!-- Sidebar Drawer -->
      <aside class="sidebar" id="sidebar">
        <!-- Search & Filter Controls -->
        <div class="sidebar-section filter-panel">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="citySearchInput" placeholder="搜尋全台縣市或天氣 (如：臺北、雨)..." autocomplete="off">
            <button class="btn-clear-search" id="btnClearSearch" aria-label="清除搜尋">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- Temperature Filter Tabs -->
          <div class="filter-tabs" id="filterTabs">
            <button class="tab-btn active" data-filter="all">全部 <span class="tab-count" id="countAll">22</span></button>
            <button class="tab-btn tab-hot" data-filter="hot">炎熱 ≥30°C <span class="tab-count" id="countHot">0</span></button>
            <button class="tab-btn tab-mild" data-filter="mild">溫和 22-29°C <span class="tab-count" id="countMild">0</span></button>
            <button class="tab-btn tab-cool" data-filter="cool">涼爽 <22°C <span class="tab-count" id="countCool">0</span></button>
          </div>
        </div>

        <!-- Selected Location Highlight Card -->
        <div class="sidebar-section active-card-section" id="activeCardContainer">
          <div class="active-city-card" id="activeCityCard">
            <div class="card-empty-state">
              <i class="fa-solid fa-location-crosshairs"></i>
              <p>點選地圖標記或下方列表查看縣市詳情</p>
            </div>
          </div>
        </div>

        <!-- County Weather Cards List -->
        <div class="sidebar-section county-list-section">
          <div class="section-title-bar">
            <span class="section-title"><i class="fa-solid fa-list-ul"></i> 縣市觀測清單</span>
            <span class="county-count" id="visibleCountyCount">22 處測站</span>
          </div>
          <div class="county-card-list" id="countyCardList">
            <!-- Dynamic Cards Loaded from JS -->
            <div class="loading-state">
              <i class="fa-solid fa-spinner fa-spin"></i>
              <span>氣象資料載入中...</span>
            </div>
          </div>
        </div>

        <!-- Sidebar Footer -->
        <footer class="sidebar-footer">
          <div class="footer-attribution">
            <span>資料來源：<a href="https://opendata.cwa.gov.tw" target="_blank" rel="noopener">交通部中央氣象署 OpenData</a></span>
            <span>技術：Leaflet · Vercel · GitHub Actions</span>
          </div>
        </footer>
      </aside>

      <!-- Map Viewport -->
      <main class="map-viewport">
        <div id="map" class="map-container"></div>

        <!-- Floating Map Controls Overlay -->
        <div class="map-floating-overlay">
          <!-- Basemap Switcher -->
          <div class="basemap-selector" id="basemapSelector">
            <button class="basemap-btn active" data-theme="dark" title="科技深色底圖">
              <i class="fa-solid fa-moon"></i> 暗黑科技
            </button>
            <button class="basemap-btn" data-theme="light" title="清新淺色底圖">
              <i class="fa-solid fa-sun"></i> 明亮簡約
            </button>
            <button class="basemap-btn" data-theme="osm" title="開放街圖底圖">
              <i class="fa-solid fa-map"></i> 街道標準
            </button>
          </div>

          <!-- Map Legend -->
          <div class="map-legend">
            <div class="legend-header"><i class="fa-solid fa-palette"></i> 氣溫色階圖例</div>
            <div class="legend-items">
              <div class="legend-item">
                <span class="legend-dot dot-hot"></span>
                <span>炎熱 ≥ 30°C</span>
              </div>
              <div class="legend-item">
                <span class="legend-dot dot-mild"></span>
                <span>舒適 22°C ~ 29°C</span>
              </div>
              <div class="legend-item">
                <span class="legend-dot dot-cool"></span>
                <span>涼爽 < 22°C</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Map Reset Center Floating Button -->
        <button class="btn-reset-map" id="btnResetMap" title="重設視角至全台灣" aria-label="全台視野">
          <i class="fa-solid fa-crosshairs"></i> 全台視野
        </button>
      </main>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- App JS -->
  <script src="js/app.js"></script>
</body>
</html>
